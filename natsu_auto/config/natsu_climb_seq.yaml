#  すべて仮置き。実機で計測して更新すること。
natsu_climb_seq_node:
  ros__parameters:

    # ── 共通(デバウンス/滞在/鮮度) ─────────────────────────
    # しきい値を連続で満たすべきフレーム数。1にすると1サンプルで遷移＝素通りしやすい
    confirm_frames: 3
    # フェーズに入ってから完了判定を許可するまでの最低滞在時間 [s]
    min_state_dwell: 0.3
    # 壁/IMUの値がこの秒数より古ければ無効扱い [s]
    sensor_timeout: 0.5

    # ── DETECT_STEP: 段まで詰める ───────────────────────────
    # この距離まで詰めたら停止 [m]。※LiDAR取付位置基準。機体前端ではないので実測すること
    target_distance: 0.25
    # 接近速度の上限 [m/s]。zakiomniの最低速(≈0.32)未満は結局最低速で動く
    approach_v: 0.30
    # 残距離に対する接近Pゲイン([m/s]/[m])。目標手前で減速させる
    approach_kp: 1.0
    # 接近の打ち切り [s]。approach_v × これ が前進距離の上限の目安
    approach_timeout: 6.0

    # ── ALIGN: 段に平行へ旋回(目標=LiDAR偏角, FB=IMU yaw) ───
    # LiDAR偏角→目標yaw を作る時の符号。実機でIMUとLiDARのyaw符号が逆なら -1 にする
    align_wall_angle_sign: 1.0
    # 平行とみなす目標yaw誤差の許容 [rad]
    align_angle_tol: 0.03
    # 旋回P制御ゲイン
    align_kp: 1.5
    # 最大角速度 [rad/s]
    align_omega_max: 1.0
    # 平行が出せないまま回り続けない打ち切り [s]
    align_timeout: 8.0

    # ── CLIMB: 段差超えシーケンス(omni前進 + シリンダ順次格納) ───
    #  流れ: 上げ →[前進:前輪を段へ]→ 前輪格納 →[前進:後輪を段へ]→ 後輪格納
    #  期待衝撃3回: 上げ / 前輪乗り / 後輪乗り。すべて実測して調整すること。
    # シリンダ上げ後、動き出す前の保持 [s]
    climb_raise_hold: 1.0
    # 前進(前輪を段へ): 目標距離[m] / 速度[m/s] / 打ち切り[s]
    climb_fwd_front_dist: 0.30
    climb_fwd_front_v: 0.20
    climb_fwd_front_timeout: 5.0
    # 前輪格納の保持 [s]
    climb_stow_front_hold: 0.8
    # 前進(後輪を段へ): 目標距離[m] / 速度[m/s] / 打ち切り[s]
    climb_fwd_rear_dist: 0.30
    climb_fwd_rear_v: 0.20
    climb_fwd_rear_timeout: 5.0
    # 後輪格納の保持 [s]
    climb_stow_rear_hold: 0.8

    # ── IMU衝撃検知(成功確認) ───────────────────────────────
    # 加速度の大きさの重力からのずれ |‖a‖-g| がこれを超えたら衝撃 [m/s^2]
    shock_accel_thresh: 7.0
    # 衝撃の多重カウント防止クールダウン [s]
    shock_cooldown: 0.4
    # true: 前進フェーズは期待する衝撃を検知するまで完了扱いにしない(打ち切りは無条件)。
    #       false: 時間+距離だけで進め衝撃はログのみ。実機で揺れ具合を見るまでは false 推奨
    climb_require_shock: false

    # ── 制御周期 ────────────────────────────────────────────
    rate_hz: 20.0
