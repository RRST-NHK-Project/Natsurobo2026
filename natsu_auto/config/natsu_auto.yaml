    #  すべて仮置き。実機で計測して更新すること。
natsu_auto_node:
  ros__parameters:

    # ── 段差検知 / 石倉への接近 (DETECT_STEP) ───────────────
    # /wall_detection/distance がこれ以下なら「石倉前」とみなす [m]
    # ※LiDARの取り付け位置からの距離。機体前端からではないので実測すること
    step_detect_distance: 0.30

    # 石倉に詰めるときの前進速度 [m/s]
    # 機体の最低速度が約0.32m/s (zakiomniのcmd_vel_min_ratio_v)なので
    # これより小さい値を入れても0.32m/sで動く。creepさせたいならzakiomni側を下げる
    approach_v: 0.30
    # 前進の打ち切り [s]。実速度 × これ が前進距離の上限になる
    # (0.32 × 4.0 ≒ 1.3m)。壁検知が出なくてもここで必ず止まって次へ進む
    approach_timeout: 4.0
    # 壁検知値がこの秒数より古ければ無効扱い [s]
    wall_data_timeout: 0.5
    # false: 壁検知を一切待たず approach_timeout だけで進む(検知が死んでる時の逃げ道)
    use_wall_detection: true

    # ── 平行旋回 (ALIGN) ────────────────────────────────────
    # 機体の最低角速度が約0.56rad/s = 32°/s、制御20Hzなので1周期で約1.6°回る。
    # 許容をこれ以下にすると行き過ぎ→戻りを繰り返して収束しない
    align_angle_tol: 0.08      # 平行とみなす偏角 [rad] (≈4.6°)
    align_kp: 1.5              # 旋回P制御ゲイン
    align_omega_max: 1.0       # 最大角速度 [rad/s]
    align_timeout: 6.0         # 平行が出せないまま回り続けないための打ち切り [s]

    # ── 昇降後は機体を動かさない運用のため、定位置/射出位置への移動と
    #    自己位置(/localization/pose)に関するパラメータは廃止した。
    #    CLIMB完了 → その場で手動回収(MANUAL_COLLECT) → FIRE。

    # ── タイミング ──────────────────────────────────────────
    climb_timeout: 20.0       # 昇降完了待ちの保険 [s]
    fire_hold: 1.0            # 射出要求を立てる時間 [s]

    # ── 制御周期 ────────────────────────────────────────────
    rate_hz: 20.0
