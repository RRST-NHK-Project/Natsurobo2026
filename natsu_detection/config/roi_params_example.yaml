# wall_detection ROIマスク設定例
# ロボット基準(LiDAR座標系): x=前方[m], y=左方向[m]
#
# 使い方:
#   1. use_roi: true にする
#   2. RViz で /wall_detection/filtered_points を見ながら4辺を詰める
#   3. 石倉の側面点群だけが箱に入り、フィールド木枠が外れるよう調整
#
# 調整のコツ:
#   - roi_x_min/max: 石倉正対時のLiDAR〜石倉の距離帯。
#     RVizで石倉側面までの距離を測って ±マージンで挟む。
#   - roi_y_min/max: 石倉の横幅+マージン。石倉幅901mmなので
#     正対中央なら ±0.5〜0.6m くらいから。
#   - 木枠がまだ入るなら箱を小さく、石倉が欠けるなら大きく。

wall_detection_node:
  ros__parameters:
    use_roi: true
    roi_x_min: 0.10    # 前方 近い側 [m] ★実測
    roi_x_max: 1.20    # 前方 遠い側 [m] ★実測（石倉までの距離+マージン）
    roi_y_min: -0.60   # 右端 [m] ★実測
    roi_y_max: 0.60    # 左端 [m] ★実測

    # ROIで木枠を除けるので、FOVは広めでも安全になる
    # fov_half_deg: 60.0
