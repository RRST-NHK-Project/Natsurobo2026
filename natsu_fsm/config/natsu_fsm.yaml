    #  すべて仮置き。実機で計測して更新すること。
natsu_fsm_node:
  ros__parameters:

    # ── 段差検知 ────────────────────────────────────────────
    # /wall_detection/distance がこれ以下なら「石倉前」とみなす [m]
    step_detect_distance: 0.30

    # ── 平行旋回 (ALIGN) ────────────────────────────────────
    align_angle_tol: 0.05      # 平行とみなす偏角 [rad] (≈2.9°)
    align_kp: 1.5              # 旋回P制御ゲイン
    align_omega_max: 1.0       # 最大角速度 [rad/s]

    # ── 定位置 HOME (昇降後、手動回収する場所) [m,m,rad] ─────
    home_x: 3.20
    home_y: 0.30
    home_yaw: 0.0

    # ── 射出位置 SHOOT (カゴを狙える場所) [m,m,rad] ─────────
    shoot_x: 3.20
    shoot_y: -0.20
    shoot_yaw: 0.0

    # ── 到達判定 ────────────────────────────────────────────
    pos_tol: 0.05             # 位置許容 [m]
    yaw_tol: 0.05             # 角度許容 [rad]

    # ── 移動制御 ────────────────────────────────────────────
    move_kp: 1.2              # 並進P (距離→速度)
    move_v_max: 0.5           # 最大並進速度 [m/s]
    move_kp_yaw: 1.5          # 旋回P
    move_omega_max: 1.0       # 最大角速度 [rad/s]

    # ── タイミング ──────────────────────────────────────────
    climb_timeout: 20.0       # 昇降完了待ちの保険 [s]
    fire_hold: 1.0            # 射出要求を立てる時間 [s]

    # ── 制御周期 ────────────────────────────────────────────
    rate_hz: 20.0
