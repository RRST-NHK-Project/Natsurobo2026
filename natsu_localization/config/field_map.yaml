scan_matcher_localizer:
  ros__parameters:
    # 座標系: フィールド座標 [m]。原点 = スタートゾーン中心、x=前方(エリア2方向)、
    #         y=左。cage_detection_node.cpp / CageViz.js と同一規約。
    #
    # 地図は石倉(900mm角)のみ。位置だけをここで与え、4面の線分はノードが組み立てる。
    # !! 要実測 !! 以下は暫定値。実フィールドで計測して更新すること。
    ishigura_x: 3.20   # スタートゾーン中心 → 石倉手前面 の距離 [m]
    ishigura_y: 0.00   # 石倉中心の左右オフセット [m]（左が正）

    # ICP調整・トピック名などその他のパラメータはノード内デフォルトを使用。
    # 変える必要が出たらここに追記すれば上書きできる（scan_matcher_localizer.cpp 参照）。
    #LiDARは(x,y) = (-4.0, 46.0)
