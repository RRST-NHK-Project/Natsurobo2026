; PlatformIO Project Configuration File
; natsu_senser と同じ流儀。build_src_filter で焼くスケッチを1つに絞る。
; 既定は受信ファーム。送信テストを焼くときは filter を ir_transmitter.ino に変える。

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_resetmethod = nodemcu
build_src_filter = +<ir_receiver.ino> -<ir_transmitter.ino>
lib_deps =
    z3t0/IRremote@^4.4.1
    adafruit/Adafruit NeoPixel@^1.12.3
